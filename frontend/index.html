<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RenderNet</title>
    <style>
      /* Shown only if the module never loads — opening this file directly or
         serving it as static files cannot work, since .jsx needs Vite. */
      #boot-help {
        max-width: 34rem;
        margin: 18vh auto;
        padding: 0 1.5rem;
        color: #e8ecf8;
        font: 15px/1.6 ui-sans-serif, system-ui, sans-serif;
      }
      #boot-help code {
        display: block;
        margin: 1rem 0;
        padding: 0.85rem 1rem;
        background: #151d36;
        border: 1px solid #263156;
        border-radius: 8px;
        color: #93a0c4;
        white-space: pre;
      }
      body { background: #0b1020; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-help">
        <h1>RenderNet did not start</h1>
        <p>
          This is a Vite app, so it cannot be opened as a file or served as plain
          static files — the browser refuses to load <code>.jsx</code> modules that way.
        </p>
        <code>cd frontend
npm install
npm run dev</code>
        <p>Then open <strong>http://localhost:8080</strong>.</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
