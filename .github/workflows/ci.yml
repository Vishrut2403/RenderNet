name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Advisories below high are reported by the job log without failing it:
      # a moderate one in a dev dependency should not stop a render farm being
      # deployed, a high one in what serves the API should.
      - name: Audit dependencies
        run: |
          npm audit --audit-level=high --prefix backend
          npm audit --audit-level=high --prefix frontend

  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # better-sqlite3 publishes prebuilt binaries per Node ABI, and there is
      # none for Node 20 - it falls back to a source build, which Linux runners
      # survive and Windows does not. Installing is itself a test.
      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Blender is absent here, so render-dependent checks skip themselves and
      # the rest runs. The Windows runner is the point: it is the only place
      # this project is tested on the platform it actually ships to.
      - name: Test
        working-directory: backend
        run: npm test

  render:
    name: full suite with Blender
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request'

    # Pinned rather than taken from apt, which ships whatever the runner image
    # happens to carry. Tracks the workstation, which is kept on the latest.
    env:
      BLENDER_VERSION: '5.2.0'
      BLENDER_SHA256: '96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Blender
        run: |
          archive="blender-$BLENDER_VERSION-linux-x64.tar.xz"
          curl -fsSL -O "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/$archive"
          echo "$BLENDER_SHA256  $archive" | sha256sum -c -
          mkdir -p "$HOME/blender"
          tar -xJf "$archive" -C "$HOME/blender" --strip-components=1
          echo "$HOME/blender" >> "$GITHUB_PATH"

      # Separate so a missing system library fails here, plainly, rather than as
      # every render-dependent check at once.
      - name: Check Blender runs
        run: blender --version

      # Without it the encode test skips itself, and the video path is then
      # covered nowhere.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: backend
        run: npm test
